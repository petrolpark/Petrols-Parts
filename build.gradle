plugins {
    id "eclipse"
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.74'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

// Mojang ships Java 21 to end users starting in 1.20.5, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    accessTransformers {
        files('src/main/resources/META-INF/accesstransformer.cfg')
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        // gameTestServer {
        //     type = "gameTestServer"
        //     systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        // }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            jvmArguments = ["-XX:+IgnoreUnrecognizedVMOptions", "-XX:+AllowEnhancedClassRedefinition"]

            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'mixin.debug.verbose', 'true'
            systemProperty 'mixin.debug.export', 'true'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main { 
    resources {
        srcDir 'src/generated/resources'
        exclude '.cache/'
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// VS Code launches with the Eclipse classpath, which has no concept of compileOnly, so compileOnly mods
// (e.g. optional compat targets) would get loaded at runtime. MDG regenerates .vscode/launch.json in
// afterEvaluate during IDE sync, so once that's done, exclude every jar that's on the compile classpath
// but not the runtime classpath.
gradle.projectsEvaluated {
    def launchFile = rootProject.file('.vscode/launch.json')
    if (!launchFile.exists()) return
    def json = new groovy.json.JsonSlurper().parse(launchFile)
    def configs = json.configurations?.findAll { it.mainClass == 'net.neoforged.devlaunch.Main' }
    if (!configs) return
    def runtimeFiles = configurations.runtimeClasspath.files.collect { it.canonicalFile } as Set
    def compileOnlyJars = configurations.compileClasspath.files
        .collect { it.canonicalFile }
        .findAll { it.name.endsWith('.jar') && !runtimeFiles.contains(it) }
        .collect { "!" + it.path.replace('\\', '/') }
        .sort()
    def classPaths = ['$Auto'] + compileOnlyJars
    if (configs.every { it.classPaths == classPaths }) return
    configs.each { it.classPaths = classPaths }
    launchFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
}

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = "https://maven.createmod.net" } // Ponder, Flywheel, Create
    maven { url = "https://mvn.devos.one/snapshots" } // Registrate
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // ForgeConfigAPIPort
    maven { url = "https://maven.blamejared.com" } // JEI
    maven { url = "https://maven.theillusivec4.top/" } // Curios
    maven { url = "https://maven.ryanhcode.dev/releases" } // Aeronautics n shi
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    flatDir {
        dirs "../petrolpark_local_maven/petrolpark/petrolpark-${minecraft_version}/${petrolpark_library_version}"
        dirs "../petrolpark_local_maven/petrolpark/mc/pquality/pquality/${pquality_version}"
    }
}

dependencies {

    // HARD DEPENDENCIESs

    // Library
    implementation("petrolpark.mc:petrolpark-${minecraft_version}:${petrolpark_library_version}")
    api("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}")
    // Registrate (bundled with Petrolpark's Library)
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    // Create & Ponder
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")

    // SOFT DEPENDENCIES

    // JEI
    implementation("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    // pquality
    implementation("petrolpark.mc.pquality:pquality:${pquality_version}")
    // Bits n' Bobs
    compileOnly("maven.modrinth:azimuth-api:1.4.10")
    compileOnly("maven.modrinth:create-bits-n-bobs:2.3.5")
    // runtimeOnly("maven.modrinth:strut-your-stuff:1.3.1")
    
    // TESTING

    // implementation("maven.modrinth:gears-n-kinetics:1.0m")

    // Testing - Aeronautics
    // implementation("dev.eriksonn.aeronautics:aeronautics-neoforge-1.21.1:${aeronautics_version}")
    // implementation("dev.simulated_team.simulated:simulated-neoforge-1.21.1:${simulated_version}")
    // implementation("dev.ryanhcode.sable:sable-neoforge-1.21.1:${sable_version}")
    // implementation("dev.ryanhcode.offroad:offroad-neoforge-1.21.1:${offroad_version}")

    // Jade
    implementation("maven.modrinth:jade:15.10.0+neoforge")
}

jar {
    manifest.attributes([
        "MixinConfigs": "${mod_id}.mixins.json"
    ])
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

java {
    withSourcesJar()
    withJavadocJar()
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {  
            url "file://${project.projectDir}/../petrolpark_local_maven"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.withType(Copy) {
    duplicatesStrategy = 'inherit'
}

